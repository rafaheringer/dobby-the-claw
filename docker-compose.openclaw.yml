# OpenClaw docker-compose override — copy this to ~/openclaw/docker-compose.override.yml on the Pi.
#
# Variables are read from ~/openclaw/.env (populated by scripts/setup-openclaw.sh).
# Do not commit secrets — HA_URL, HA_TOKEN, DOCKER_GID live only in that file.

services:
  openclaw-gateway:
    environment:
      HA_URL: ${HA_URL}
      HA_TOKEN: ${HA_TOKEN}
      HA_CONFIG: /home/node/.openclaw/workspace/.config/home-assistant/config.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
